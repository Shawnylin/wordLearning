name: Deploy to CloudBase

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudbase-production
  cancel-in-progress: true

env:
  CLOUDBASE_ENV_ID: cooh-d1gj7cmvs2469a250
  CLOUDBASE_REGION: ap-shanghai

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Check required CloudBase secrets
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
          CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$TCB_SECRET_ID" || { echo "::error::Missing GitHub Secret: TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "::error::Missing GitHub Secret: TCB_SECRET_KEY"; exit 1; }
          test -n "$CLOUDBASE_PUBLISHABLE_KEY" || { echo "::error::Missing GitHub Secret: CLOUDBASE_PUBLISHABLE_KEY"; exit 1; }

      - name: Build production assets
        env:
          VITE_CLOUDBASE_ENV_ID: ${{ env.CLOUDBASE_ENV_ID }}
          VITE_CLOUDBASE_REGION: ${{ env.CLOUDBASE_REGION }}
          VITE_CLOUDBASE_PUBLISHABLE_KEY: ${{ secrets.CLOUDBASE_PUBLISHABLE_KEY }}
          VITE_ARTICLE_READER_URL: ${{ vars.ARTICLE_READER_URL }}
        run: npm run build

      - name: Install CloudBase CLI
        run: npm install --global @cloudbase/cli@3.8.2

      - name: Login to CloudBase CLI
        env:
          TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
          TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
        run: tcb login --apiKeyId "$TCB_SECRET_ID" --apiKey "$TCB_SECRET_KEY"

      - name: Deploy static assets
        run: >-
          tcb hosting deploy ./dist /wordLearning
          --env-id "$CLOUDBASE_ENV_ID"
          --safe
          --verify
          --json

