# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

env:
  VITE_ARTICLE_READER_URL: ${{ vars.ARTICLE_READER_URL }}

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# Prefer the newest source when several pushes arrive close together.
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        id: node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Calculate dependency cache key
        id: dependencies
        run: node .github/scripts/dependency-cache-key.mjs >> "$GITHUB_OUTPUT"
      - name: Restore dependencies
        id: dependency-cache
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            ~/.npm
          # Match the OS image, architecture, exact Node version and dependency
          # graph. A package version-only release keeps the same dependency key.
          key: deps-v1-ubuntu24-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-${{ steps.dependencies.outputs.key }}
          # A partial hit reuses downloads only: npm ci replaces node_modules.
          restore-keys: |
            deps-v1-ubuntu24-${{ runner.arch }}-${{ steps.node.outputs.node-version }}-
      - name: Install dependencies
        if: steps.dependency-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Build current source
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Only upload the dist directory
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
